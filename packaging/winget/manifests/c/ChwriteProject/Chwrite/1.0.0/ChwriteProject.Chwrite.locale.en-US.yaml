ShortDescription: Protect files in a Git repository from unwanted modification.
Description: >-
  chwrite is a dependency-free command-line tool that lets a Git repository
  declare files or directories (lockfiles, migrations, generated code, CI
  workflow files) that must not be modified, then enforces that using the
  strongest file-protection mechanism available on the local OS: Windows
  ACLs via icacls on Windows, chflags on macOS, chattr/chmod on Linux. The
  main use case is stopping coding agents, scripts, and editors from
  touching files they have no reason to touch.

  Requires a Python 3.11+ interpreter ("python" or "py") already on PATH;
  the bundled chwrite.cmd launcher locates and runs the bundled chwrite.py
  against it and exits with a clear error if no interpreter is found.
